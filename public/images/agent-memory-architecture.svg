<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 516" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13">
  <title id="t">Outcomes feed the log, and sleep turns the log into memory</title>
  <desc id="d">An online loop retrieves memories, acts, and tracks outcomes, writing each episode to an append-only log. A nightly consolidation job samples, reflects, validates, merges and decays, writing lessons into semantic and procedural memory, with optional adapter distillation behind an eval gate.</desc>
  <style>
    .ink { fill: #1d1c1a; }
    .quiet { fill: #6b6862; }
    .box { fill: none; stroke: #b4b2a9; stroke-width: 1.25; }
    .zone { fill: none; stroke: #d3d1c7; stroke-width: 1.25; stroke-dasharray: 4 4; }
    .accent { fill: #0f6e56; fill-opacity: 0.1; stroke: #0f6e56; stroke-width: 2; }
    .edge { fill: none; stroke: #888780; stroke-width: 1.25; }
    .head { fill: #888780; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e9e7e1; }
      .quiet { fill: #a19e96; }
      .box { stroke: #5f5e5a; }
      .zone { stroke: #444441; }
      .accent { fill: #5dcaa5; fill-opacity: 0.14; stroke: #5dcaa5; }
      .edge { stroke: #888780; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="head"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="15" font-weight="600" class="ink">Outcomes feed the log, and sleep turns the log into memory</text>

  <rect x="24" y="52" width="712" height="108" rx="8" class="zone"/>
  <text x="40" y="74" font-size="11.5" class="quiet">Awake: the online loop</text>
  <rect x="24" y="296" width="712" height="108" rx="8" class="zone"/>
  <text x="40" y="318" font-size="11.5" class="quiet">Asleep: nightly consolidation</text>

  <g class="edge">
    <path d="M240 116H280" marker-end="url(#a)"/>
    <path d="M480 116H520" marker-end="url(#a)"/>
    <path d="M620 144V200" marker-end="url(#a)"/>
    <path d="M140 200V144" marker-end="url(#a)"/>
    <path d="M380 200V144" marker-end="url(#a)"/>
    <path d="M620 256V296" marker-end="url(#a)"/>
    <path d="M140 296V256" marker-end="url(#a)"/>
    <path d="M380 296V256" marker-end="url(#a)"/>
    <path d="M195 360H215" marker-end="url(#a)"/>
    <path d="M370 360H390" marker-end="url(#a)"/>
    <path d="M545 360H565" marker-end="url(#a)"/>
    <path d="M380 404V436" marker-end="url(#a)"/>
  </g>

  <rect x="40" y="88" width="200" height="56" rx="8" class="box"/>
  <text x="140" y="112" text-anchor="middle" font-weight="600" class="ink">Retrieve</text>
  <text x="140" y="128" text-anchor="middle" font-size="11.5" class="quiet">ranked by utility</text>

  <rect x="280" y="88" width="200" height="56" rx="8" class="box"/>
  <text x="380" y="112" text-anchor="middle" font-weight="600" class="ink">Act</text>
  <text x="380" y="128" text-anchor="middle" font-size="11.5" class="quiet">logs retrieved memory IDs</text>

  <rect x="520" y="88" width="200" height="56" rx="8" class="accent"/>
  <text x="620" y="112" text-anchor="middle" font-weight="600" class="ink">Track outcomes</text>
  <text x="620" y="128" text-anchor="middle" font-size="11.5" class="ink">explicit, implicit, delayed</text>

  <rect x="40" y="200" width="200" height="56" rx="8" class="box"/>
  <text x="140" y="224" text-anchor="middle" font-weight="600" class="ink">Semantic memory</text>
  <text x="140" y="240" text-anchor="middle" font-size="11.5" class="quiet">lessons with evidence counts</text>

  <rect x="280" y="200" width="200" height="56" rx="8" class="box"/>
  <text x="380" y="224" text-anchor="middle" font-weight="600" class="ink">Procedural memory</text>
  <text x="380" y="240" text-anchor="middle" font-size="11.5" class="quiet">validated skills</text>

  <rect x="520" y="200" width="200" height="56" rx="8" class="box"/>
  <text x="620" y="224" text-anchor="middle" font-weight="600" class="ink">Episodic log</text>
  <text x="620" y="240" text-anchor="middle" font-size="11.5" class="quiet">append-only source of truth</text>

  <rect x="40" y="332" width="155" height="56" rx="8" class="box"/>
  <text x="117.5" y="356" text-anchor="middle" font-weight="600" class="ink">Sample</text>
  <text x="117.5" y="372" text-anchor="middle" font-size="11.5" class="quiet">by surprise, outcome</text>

  <rect x="215" y="332" width="155" height="56" rx="8" class="box"/>
  <text x="292.5" y="356" text-anchor="middle" font-weight="600" class="ink">Reflect</text>
  <text x="292.5" y="372" text-anchor="middle" font-size="11.5" class="quiet">wins vs. losses</text>

  <rect x="390" y="332" width="155" height="56" rx="8" class="box"/>
  <text x="467.5" y="356" text-anchor="middle" font-weight="600" class="ink">Validate</text>
  <text x="467.5" y="372" text-anchor="middle" font-size="11.5" class="quiet">held-out replay</text>

  <rect x="565" y="332" width="155" height="56" rx="8" class="box"/>
  <text x="642.5" y="356" text-anchor="middle" font-weight="600" class="ink">Merge and decay</text>
  <text x="642.5" y="372" text-anchor="middle" font-size="11.5" class="quiet">forget the weak</text>

  <rect x="280" y="436" width="200" height="56" rx="8" class="box" stroke-dasharray="4 3"/>
  <text x="380" y="460" text-anchor="middle" font-weight="600" class="ink">Adapter distillation</text>
  <text x="380" y="476" text-anchor="middle" font-size="11.5" class="quiet">optional, eval-gated</text>
</svg>
